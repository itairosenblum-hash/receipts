name: Deploy Firebase (functions + rules)
# פריסה אוטומטית של ה-Cloud Functions וה-Rules בכל שינוי ב-main.
# נדרשים Secrets בריפו: FIREBASE_SERVICE_ACCOUNT, GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET, GEMINI_API_KEY

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "firestore.rules"
      - "storage.rules"
      - "firebase.json"
      - ".github/workflows/functions.yml"
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

env:
  PROJECT: shopping-fa855

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install
        run: |
          npm ci --prefix functions
          npm install -g firebase-tools

      - name: Check service account secret
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Missing repo secret FIREBASE_SERVICE_ACCOUNT (see README)"
            exit 1
          fi

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Sync function secrets
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          for name in GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET GEMINI_API_KEY; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::Missing repo secret $name (see README)"
              exit 1
            fi
            current="$(firebase functions:secrets:access "$name" --project "$PROJECT" 2>/dev/null || true)"
            if [ "$current" != "$value" ]; then
              echo "Updating $name"
              printf '%s' "$value" | firebase functions:secrets:set "$name" --data-file=- --project "$PROJECT" --non-interactive --force
            else
              echo "$name unchanged"
            fi
          done

      - name: Deploy
        run: firebase deploy --only functions,firestore:rules --project "$PROJECT" --non-interactive --force
