<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F6E6A">
<title>קבלות ואחריות</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Rubik:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<script type="module" src="app.js"></script>
</head>
<body>

<!-- טעינה -->
<section id="view-loading" class="view view-center">
  <div class="spinner" aria-label="טוען"></div>
</section>

<!-- כניסה -->
<section id="view-login" class="view view-login" hidden>
  <div class="login-hero">
    <div class="app-mark" aria-hidden="true">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9.5 11.5l1.8 1.8 3.5-3.6"/></svg>
    </div>
    <h1>קבלות ואחריות</h1>
    <p>כל הקבלות של הרכישות הגדולות במקום אחד, עם תזכורת לפני שהאחריות נגמרת.</p>
  </div>
  <div class="login-actions">
    <button id="btn-login" class="btn-google" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.5 12.3c0-.8-.1-1.5-.2-2.2H12v4.2h5.9a5 5 0 0 1-2.2 3.3v2.7h3.5c2.1-1.9 3.3-4.7 3.3-8z"/><path fill="#34A853" d="M12 23c3 0 5.4-1 7.2-2.7l-3.5-2.7c-1 .7-2.2 1-3.7 1-2.9 0-5.3-1.9-6.2-4.5H2.2v2.8A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.8 14.1a6.6 6.6 0 0 1 0-4.2V7.1H2.2a11 11 0 0 0 0 9.8z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3 .6 4.2 1.6l3.1-3.1A11 11 0 0 0 2.2 7.1l3.6 2.8C6.7 7.3 9.1 5.4 12 5.4z"/></svg>
      כניסה עם Google
    </button>
    <p class="muted center">הגישה מוגבלת לחשבונות מורשים בלבד</p>
    <p id="login-error" class="error center" hidden></p>
  </div>
</section>

<!-- אין הרשאה -->
<section id="view-denied" class="view view-center" hidden>
  <div class="card denied">
    <h1>אין לך הרשאה</h1>
    <p>החשבון <b id="denied-email"></b> לא נמצא ברשימת המורשים. אפשר לבקש מהמנהל להוסיף אותו.</p>
    <button id="btn-denied-logout" class="btn-secondary" type="button">יציאה והחלפת חשבון</button>
  </div>
</section>

<!-- רשימת קבלות -->
<section id="view-list" class="view view-app" hidden>
  <header class="app-header">
    <h1>הקבלות שלנו</h1>
    <a href="#/settings" class="avatar" id="avatar" aria-label="הגדרות"></a>
  </header>
  <label class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <span class="sr-only">חיפוש</span>
    <input id="search" type="search" placeholder="חיפוש מוצר, חנות או תגית">
  </label>
  <div id="receipts" class="receipts"></div>
  <div id="empty" class="empty" hidden>
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>
    <h2>עוד אין קבלות</h2>
    <p>העלאת קבלות תתווסף בשלב הבא של הפיתוח.</p>
  </div>
  <button class="fab" type="button" aria-label="העלאת קבלה" disabled title="יתווסף בשלב 2">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</section>

<!-- הגדרות -->
<section id="view-settings" class="view view-app" hidden>
  <header class="app-header">
    <a href="#/" class="icon-btn" aria-label="חזרה">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </a>
    <h1>הגדרות</h1>
    <span class="icon-btn" aria-hidden="true"></span>
  </header>

  <div class="card">
    <h2>מחובר כ</h2>
    <p id="settings-email" class="strong"></p>
    <button id="btn-logout" class="btn-secondary" type="button">יציאה</button>
  </div>

  <div class="card" id="access-card">
    <h2>חשבונות מורשים</h2>
    <p class="muted" id="access-hint"></p>
    <ul id="access-list" class="access-list"></ul>
    <form id="access-form" class="access-form" hidden>
      <label for="access-input" class="sr-only">כתובת מייל להוספה</label>
      <input id="access-input" type="email" placeholder="כתובת Gmail להוספה" required dir="ltr">
      <button type="submit" class="btn-primary">הוספה</button>
    </form>
    <button id="btn-init-access" class="btn-primary" type="button" hidden>יצירת רשימת מורשים</button>
    <p id="access-error" class="error" hidden></p>
  </div>
</section>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
